name: Java Web Application CI-CD

on:
  push:
    branches:
      - main

jobs:

  build:
  
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Build WAR File
      run: |
        mvn clean package

    - name: SonarCloud Scan 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |

         mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
         -Dsonar.projectKey=harshitha-b01_New-Java-webapp-assignment-01 \
         -Dsonar.organization=harshitha-b01
       

    - name: Upload WAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-war
        path: target/*.war


  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Download WAR
      uses: actions/download-artifact@v4
      with:
        name: application-war


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-2

    - name: Check EC2 Instance

      run: |

        INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=Tomcat-server1" \
        "Name=instance-state-name,Values=running" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

        echo "Existing Instance: $INSTANCE_ID"

    - name: Create RedHat EC2
      if: env.INSTANCE_ID == ''
      run: |

        INSTANCE_ID=$(aws ec2 run-instances \
        --image-id ami-02e3c96eaee2fe306 \
        --instance-type t3.micro \
        --key-name key-1 \
        --security-group-ids sg-05232a653e5e623fa \
        --tag-specifications \
        'ResourceType=instance,Tags=[{Key=Name,Value=Tomcat-server1}]' \
        --query 'Instances[0].InstanceId' \
        --output text)

        echo "Created EC2: $INSTANCE_ID"

        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
        

    - name: Wait for EC2
      run: |
       aws ec2 wait instance-running --instance-ids ${{ env.INSTANCE_ID }}
          sleep 60

    - name: Get EC2 Public IP
      run: |

        PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=Tomcat-server1" \
        "Name=instance-state-name,Values=running" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text)

        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

        echo "Server IP: $PUBLIC_IP"
        
    - name: Configure SSH Key
      run: |
      
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
        chmod 600 ec2-key.pem
   
    - name: Install Java 21 and Tomcat
      run: |

       ssh -i ec2-key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.PUBLIC_IP }} << 'EOF'

       set -e

       echo "===== Updating Server ====="
       sudo dnf update -y

       echo "===== Installing Java 21 ====="
       sudo dnf install -y java-21-openjdk java-21-openjdk-devel

       java -version

       echo "===== Installing wget ====="
       sudo dnf install -y wget

       echo "===== Moving to /opt ====="
       cd /opt

       if [ ! -d "/opt/tomcat" ]; then

        echo "===== Downloading Tomcat ====="

       sudo wget https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.42/bin/apache-tomcat-10.1.42.tar.gz

       echo "===== Checking Download ====="
       ls -lh /opt

       echo "===== Extracting Tomcat ====="
       sudo tar -xzf apache-tomcat-10.1.42.tar.gz

       echo "===== Checking Extracted Folder ====="
       ls -l /opt

       echo "===== Renaming Folder ====="
       sudo mv apache-tomcat-10.1.42 /opt/tomcat

     else

      echo "Tomcat already installed."

     fi

     echo "===== Verify Tomcat Folder ====="
     ls -l /opt

     ls -l /opt/tomcat

     sudo chmod +x /opt/tomcat/bin/*.sh

     sudo systemctl enable firewalld
     sudo systemctl start firewalld

     sudo firewall-cmd --permanent --add-port=8080/tcp
     sudo firewall-cmd --reload

     sudo /opt/tomcat/bin/startup.sh

     sleep 10

     ps -ef | grep tomcat

     ls -l /opt/tomcat
    
     ls -l /opt/tomcat/webapps
 
     sudo ss -tulnp | grep 8080 || true

     EOF

    - name: Deploy WAR File
      run: |

        scp -i ec2-key.pem -o StrictHostKeyChecking=no \
        *.war \
        ec2-user@${{ env.PUBLIC_IP }}:/opt/tomcat/webapps/


    - name: Restart Tomcat
      run: |

       ssh -i ec2-key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.PUBLIC_IP }} << 'EOF'

       sudo /opt/tomcat/bin/shutdown.sh || true

       sleep 10

       sudo /opt/tomcat/bin/startup.sh

       EOF

    - name: Verify Deployment
      run: |

        sleep 20

        curl http://${{ env.PUBLIC_IP }}:8080/


    - name: Display Application URL
      run: |

        echo "Application is deployed successfully"
        echo "Application URL: http://${{ env.PUBLIC_IP }}:8080/assignment1-harshitha"

