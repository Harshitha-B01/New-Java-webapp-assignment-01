name: Java Web Application CI-CD

on:
  push:
    branches:
      - main

jobs:

# ==========================================================
# CI JOB
# ==========================================================

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=harshitha-b01_New-Java-webapp-assignment-01 \
            -Dsonar.organization=harshitha-b01

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war

# ==========================================================
# CD JOB
# ==========================================================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

# ==========================================================
# CHECK EC2
# ==========================================================

      - name: Check Existing EC2
        id: check_ec2
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=Tomcat-server1" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No EC2 instance found."
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Existing EC2: $INSTANCE_ID"
          fi

# ==========================================================
# CREATE EC2
# ==========================================================

      - name: Create EC2
        if: steps.check_ec2.outputs.exists == 'false'
        run: |

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ami-02e3c96eaee2fe306 \
            --instance-type t3.micro \
            --key-name key-1 \
            --security-group-ids sg-05232a653e5e623fa \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Tomcat-server1}]' \
            --user-data file://.github/workflows/scripts/install-tomcat.sh \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "Created EC2: $INSTANCE_ID"

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

# ==========================================================
# WAIT FOR EC2
# ==========================================================

      - name: Wait for Instance
        run: |

          aws ec2 wait instance-running \
            
          sleep 120

# ==========================================================
# GET PUBLIC IP
# ==========================================================

      - name: Get Public IP
        run: |

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

          echo "Public IP: $PUBLIC_IP"

# ==========================================================
# SSH KEY
# ==========================================================

      - name: Configure SSH Key
        run: |

          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem

          chmod 600 ec2-key.pem

# ==========================================================
# DEPLOY WAR
# ==========================================================

      - name: Deploy WAR
        run: |

          scp -o StrictHostKeyChecking=no \
              -i ec2-key.pem \
              *.war \
              ec2-user@${{ env.PUBLIC_IP }}:/opt/tomcat/webapps/

# ==========================================================
# RESTART TOMCAT
# ==========================================================

      - name: Restart Tomcat
        run: |

          ssh -o StrictHostKeyChecking=no \
              -i ec2-key.pem \
              ec2-user@${{ env.PUBLIC_IP }} << EOF

          /opt/tomcat/bin/shutdown.sh || true

          sleep 10

          /opt/tomcat/bin/startup.sh

          EOF

# ==========================================================
# APPLICATION URL
# ==========================================================

      - name: Display URL
        run: |

          echo "Deployment Successful"

          echo "http://${{ env.PUBLIC_IP }}:8080/assignment1-harshitha"
